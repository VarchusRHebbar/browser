<title>Heaven's Treat Opener</title>
<!--
  STYLE BRIEF
  Brand + feeling      : Heaven's Treat (cheesecakes, fudgy brownies, dipped fruit · HSR Layout) — indulgent, warm, a little magical
  Concepts             : 1 one continuous shot (sky -> counter) / 6 product macro / 7 object metaphor -> picked 1:
                         the name says "heaven"; the stall sells at night, so the camera falls from a night sky onto the counter
  Structure fingerprint: one continuous shot · 6 moments · heart -> jar -> brownie -> strawberry -> wide -> badge ·
                         opens on a falling heart · closes on the real logo badge with a ring drawn round it
  Palette (from logo)  : navy #1B2B4F (logo ring/"Heaven's") · orange-red #D24C2A ("Treat", hearts) · cream #F6E6CC (badge ground)
  Fonts                : Fraunces 500 (display) + DM Sans 500 (label)
  Text emphasis        : none (no highlight shapes); words arrive faint then settle; no full stops
  Background           : night navy, twinkling stars, drifting clouds -> warm street-light bokeh at the counter ->
                         a cream wave rises (visible trigger) for the tagline and badge; cream blobs drift
  Signature motion     : a line that draws itself (white-choc drizzle, chocolate coat edge, the badge ring)
  Render family        : soft clay — rounded SVG with radial gradients and soft shadows
  Special moment       : strawberry dipped under the chocolate surface and lifted out coated, drips falling back
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --navy:#1B2B4F; --navy-deep:#0C1530; --orange:#D24C2A; --orange-lit:#F07A4E;
  --cream:#F6E6CC; --cream-lit:#FFF4E2; --choc:#2E170C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05070f;overflow:hidden;font-family:"Fraunces",Georgia,serif}
#filters{position:fixed;width:0;height:0;opacity:0;pointer-events:none}
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);overflow:hidden;
  background:linear-gradient(180deg,#081028 0%,#122046 55%,#1B2B4F 100%)}
.layer{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.abs{position:absolute}

/* sky */
#moonglow{position:absolute;inset:0;background:radial-gradient(42% 50% at 72% 18%,rgba(246,230,204,.20),transparent 70%),
  radial-gradient(60% 40% at 20% 90%,rgba(60,80,150,.35),transparent 70%)}
#warm{position:absolute;inset:0;opacity:0;background:radial-gradient(70% 55% at 50% 100%,rgba(210,76,42,.38),transparent 70%),
  radial-gradient(40% 30% at 15% 70%,rgba(240,170,80,.16),transparent 70%)}
.bk{position:absolute;border-radius:50%;filter:blur(10px)}

/* cream wave */
#creamwrap{position:absolute;left:0;top:0;width:1920px;height:2800px;will-change:transform}
#creamwrap svg{position:absolute;left:0;top:0}
.blob{position:absolute;border-radius:50%}

/* text */
.t{position:absolute;font-weight:500;font-size:124px;line-height:1.04;letter-spacing:-.012em;color:var(--cream-lit);
  white-space:nowrap;text-shadow:0 6px 30px rgba(4,8,24,.55);font-variation-settings:"opsz" 144}
.t .ln{display:block}
.t.r{text-align:right;transform:translateX(-100%)}
.t.c{text-align:center;transform:translateX(-50%)}
.t.ink{color:var(--navy);text-shadow:0 2px 0 rgba(255,255,255,.35)}
.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;will-change:transform,opacity}
.label{position:absolute;font-family:"DM Sans",system-ui,sans-serif;font-weight:600;font-size:44px;letter-spacing:.02em;
  color:var(--navy);white-space:nowrap;transform:translateX(-50%);display:flex;align-items:center;gap:16px;opacity:0}

#grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 45%,rgba(3,6,18,.55) 88%,rgba(3,6,18,.8) 100%)}

#ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;align-items:center;gap:14px;padding:11px 18px;
  border-radius:16px;background:rgba(14,16,22,.9);border:1px solid rgba(255,255,255,.1);font:13px system-ui,sans-serif;color:#A0A6B4;z-index:50}
#ui.on{display:flex}
#ui button{background:#262A34;color:#fff;border:none;padding:8px 16px;border-radius:9px;font:inherit;cursor:pointer}
#scrub{width:340px;accent-color:var(--orange)}
#clock{font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right}
</style>
</head>

<script>
/* ============ utilities ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg';
let seed=7; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}; // seeded: same world every load
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};

const defs=$('#filters defs');let fc=0;
function makeBlur(){const id='mb'+(fc++);const f=el('filter',{id,x:'-70%',y:'-70%',width:'240%',height:'240%'},defs);
  const g=el('feGaussianBlur',{stdDeviation:'0 0'},f);return{url:`url(#${id})`,node:g};}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){
  const b=makeBlur(),o={v:from};tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(targets,{filter:'none'},at+dur);}
const VERT={ax:.1,ay:1};
function splitChars(root){const out=[];
  for(const ln of $$('.ln',root)){const words=ln.textContent.split(' ');ln.textContent='';
    words.forEach((w,i)=>{const wr=document.createElement('span');wr.className='wd';
      for(const c of w){const s=document.createElement('span');s.className='ch';s.textContent=c;wr.appendChild(s);out.push(s);}
      ln.appendChild(wr);
      if(i<words.length-1){const sp=document.createElement('span');sp.className='ch';sp.innerHTML='&nbsp;';ln.appendChild(sp);out.push(sp);}});}
  return out;}

/* ============ build the world (seeded, once) ============ */
// stars
{const s=$('#stars');for(let i=0;i<170;i++){const r=rnd()<.12?2.6:1.1+rnd()*1.2;
  el('circle',{cx:(rnd()*2400).toFixed(1),cy:(rnd()*3000).toFixed(1),r,fill:rnd()<.2?'#FFD9B8':'#F6EEDD','data-s':(rnd()*6.28).toFixed(2)},s);}}
const STARS=$$('#stars circle').map(c=>({c,s:+c.dataset.s,b:.35+rnd()*.6}));
// clouds
function cloud(w,fill1,fill2,op){const h=w*.42,id='cg'+(fc++);
  const svg=el('svg',{width:w,height:h,viewBox:`0 0 ${w} ${h}`});svg.style.overflow='visible';
  const d=el('defs',{},svg);const g=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:h*.85,gradientUnits:'userSpaceOnUse'},d);
  el('stop',{offset:0,'stop-color':fill1},g);el('stop',{offset:1,'stop-color':fill2},g);
  const grp=el('g',{fill:`url(#${id})`,opacity:op},svg);
  const n=5+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){const cx=w*(.14+.72*i/(n-1)),r=h*(.28+rnd()*.32)*(1-Math.abs(i/(n-1)-.5)*.7);el('circle',{cx,cy:h*.72-r*.55,r},grp);}
  el('rect',{x:w*.08,y:h*.52,width:w*.84,height:h*.3,rx:h*.15},grp);
  return svg;}
const CLOUDS=[];
function addCloud(parent,x,y,w,op,c1,c2,drift){const d=document.createElement('div');d.className='abs';d.style.left=x+'px';d.style.top=y+'px';
  d.appendChild(cloud(w,c1,c2,op));parent.appendChild(d);CLOUDS.push({d,x,drift,s:rnd()*6.28});return d;}
[[120,-1820,620],[1180,-1700,520],[1500,-1340,700],[-140,-1260,560],[380,-560,640],[1300,-700,560],[700,-1500,420],[-60,-160,520],[1560,-260,620],[880,-120,380]]
  .forEach(([x,y,w],i)=>addCloud($('#clouds'),x,y,w,.78,'#DCD8EE','#6D7BAA',(i%2?1:-1)*(10+i*2)));
// foreground clouds — big, soft, faster
[[-300,-1180,1100],[1100,-820,1200],[-200,-260,1000],[1200,40,900]].forEach(([x,y,w],i)=>{const d=addCloud($('#L-fg'),x,y,w,.9,'#EDE8F6','#8A95C0',(i%2?1:-1)*24);d.style.filter='blur(6px)';});
// bokeh (street lights)
{const L=$('#L-bokeh');const cols=['rgba(255,190,110,','rgba(240,110,70,','rgba(255,230,170,'];
 for(let i=0;i<22;i++){const b=document.createElement('div');b.className='bk';const s=40+rnd()*120;
  Object.assign(b.style,{left:(-400+rnd()*3600)+'px',top:(-200+rnd()*700)+'px',width:s+'px',height:s+'px',background:cols[i%3]+(.25+rnd()*.35)+')'});
  b.dataset.s=(rnd()*6.28).toFixed(2);L.appendChild(b);}}
const BOKEH=$$('#L-bokeh .bk').map(b=>({b,s:+b.dataset.s}));
// jar details
{const c=$('#crumbs');for(let i=0;i<40;i++)el('circle',{cx:70+rnd()*300,cy:418+rnd()*100,r:2+rnd()*4},c);
 const cr=$('#crumble');for(let i=0;i<26;i++){const g=el('circle',{cx:150+rnd()*200,cy:122+rnd()*22,r:5+rnd()*6,fill:rnd()<.5?'#DDAA5E':'#C08A44'},cr);g.dataset.y=g.getAttribute('cy');}
 const B=$('#berries');[[160,112,36],[236,98,40],[306,116,34],[198,126,30]].forEach(([x,y,r])=>{const g=el('g',{},B);
   el('circle',{cx:x,cy:y,r,fill:'url(#gBerry)'},g);el('ellipse',{cx:x-r*.35,cy:y-r*.38,rx:r*.25,ry:r*.14,fill:'rgba(255,255,255,.55)'},g);
   el('path',{d:`M${x-8} ${y-r+6} l8 6 l8 -6 l-2 9 l-6 3 l-6 -3 z`,fill:'#141838'},g);});}
// brownie chips, strawberry seeds
{const c=$('#chips');[[180,272],[250,262],[340,282],[420,262],[300,256]].forEach(([x,y])=>el('rect',{x:x-9,y:y-7,width:18,height:14,rx:4,transform:`rotate(${(rnd()*60-30).toFixed(0)} ${x} ${y})`},c));
 const s=$('#seeds');for(let i=0;i<34;i++){const y=230+rnd()*170,half=Math.max(8,92*(1-((y-230)/200)**1.6));el('ellipse',{cx:260+(rnd()*2-1)*half*.85,cy:y,rx:3.2,ry:5},s);}}
// popping hearts (finale)
const HP='M60 104 C 20 76 4 52 4 32 C 4 14 18 2 34 2 C 46 2 55 9 60 20 C 65 9 74 2 86 2 C 102 2 116 14 116 32 C 116 52 100 76 60 104 Z';
const POPS=[[960,120],[2560,150],[4160,40]].map(([x,y])=>{const s=el('svg',{width:240,height:220,viewBox:'0 0 120 110'});
  el('path',{d:HP,fill:'#D24C2A'},s);const d=document.createElement('div');d.className='abs';
  Object.assign(d.style,{left:(x-120)+'px',top:(y-110)+'px',opacity:0});d.appendChild(s);$('#pops').appendChild(d);return d;});
const MINI=[[2190,240,.5],[2950,300,.38],[2860,700,.3]].map(([x,y,sc])=>{const s=el('svg',{width:120,height:110,viewBox:'0 0 120 110'});
  el('path',{d:HP,fill:'#D24C2A'},s);const d=document.createElement('div');d.className='abs';
  Object.assign(d.style,{left:(x-60)+'px',top:(y-55)+'px',opacity:0,transform:`scale(${sc})`});d.appendChild(s);$('#pops').appendChild(d);return d;});

/* ============ state + render (pure function of tl.time()) ============ */
const cam={x:960,y:-1500,z:1}, heart={x:960,y:-1640,s:1,r:0,o:0}, sky={warm:0,cream:1150,clouds:1,stars:1,vig:1};
const W_=$('#world'),LS=$('#L-stars'),LB=$('#L-bokeh'),LF=$('#L-fg'),HEART=$('#heart'),CW=$('#creamwrap');
function place(node,p,zf,cx,cy,z){const zz=1+(z-1)*zf;node.style.transform=`translate(${960-cx*p*zz}px,${540-cy*p*zz}px) scale(${zz})`;}
function wavePath(t,amp,off,ph){let d=`M0 ${off}`;for(let x=0;x<=1920;x+=40){d+=` L${x} ${(off+Math.sin(x*.0042+t*1.5+ph)*amp+Math.sin(x*.011-t*1.1+ph)*amp*.35).toFixed(1)}`;}return d+' L1920 2800 L0 2800 Z';}
function render(t){
  const cx=cam.x+Math.sin(t*.41)*7, cy=cam.y+Math.cos(t*.33)*6, z=cam.z*(1+Math.sin(t*.27)*.006);
  place(W_,1,1,cx,cy,z); place(LF,1.55,1.3,cx,cy,z); place(LS,.12,.1,cx,cy,z); place(LB,.35,.4,cx,cy,z);
  for(const s of STARS)s.c.setAttribute('opacity',(sky.stars*s.b*(.45+.55*Math.abs(Math.sin(t*1.3+s.s)))).toFixed(2));
  for(const c of CLOUDS){c.d.style.transform=`translateX(${(Math.sin(t*.15+c.s)*30+t*c.drift).toFixed(1)}px)`;}
  $('#clouds').style.opacity=sky.clouds; LF.style.opacity=sky.clouds;
  for(const b of BOKEH){b.b.style.transform=`translateY(${(Math.sin(t*.5+b.s)*18).toFixed(1)}px) scale(${(1+Math.sin(t*.7+b.s)*.08).toFixed(3)})`;}
  LB.style.opacity=sky.warm*.9; $('#warm').style.opacity=sky.warm;
  HEART.style.transform=`translate(${heart.x-60}px,${heart.y-55}px) rotate(${heart.r}deg) scale(${heart.s*(1+Math.sin(t*5)*.04)})`;
  HEART.style.opacity=heart.o; $('#spark').style.opacity=(.5+.5*Math.sin(t*4)).toFixed(2)*heart.o;
  CW.style.transform=`translateY(${sky.cream}px)`;
  $('#wave').setAttribute('d',wavePath(t,26,120,0)); $('#wave2').setAttribute('d',wavePath(t,30,70,2.1));
  $('#cb1').style.transform=`translate(${Math.sin(t*.3)*60}px,${Math.cos(t*.25)*40}px)`;
  $('#cb2').style.transform=`translate(${Math.cos(t*.22)*70}px,${Math.sin(t*.28)*50}px)`;
  $('#cb3').style.transform=`translate(${Math.sin(t*.18+1)*80}px,${Math.cos(t*.2)*30}px)`;
  $('#vig').style.opacity=sky.vig;
}

/* ============ timeline — the only place time is written ============ */
const Q=new URLSearchParams(location.search);
const DURATION=30;
const tl=gsap.timeline({paused:true});
const T=gsap.utils.toArray; const I={immediateRender:false};

// text doors (different per scene)
const inDown=(ch,e,at)=>{tl.fromTo(ch,{opacity:0,yPercent:-60,scaleY:1.4},{opacity:1,yPercent:0,scaleY:1,duration:.9,ease:'power4.out',stagger:.022,...I},at);blurTween(tl,e,at,28,0,.9,VERT);};
const inWords=(e,at)=>{const w=$$('.wd',e);tl.set($$('.ch',e),{opacity:1},at);
  tl.fromTo(w,{opacity:0,yPercent:45,rotateX:-60},{opacity:.4,yPercent:0,rotateX:0,duration:.6,ease:'back.out(1.6)',stagger:.16,...I},at);
  tl.to(w,{opacity:1,duration:.5,stagger:.16},at+.45);};
const inLeft=(ch,e,at)=>{tl.fromTo(ch,{opacity:0,xPercent:-50},{opacity:1,xPercent:0,duration:.8,ease:'power4.out',stagger:.02,...I},at);blurTween(tl,e,at,46,0,.8,{ease:'power4.out'});};
const inMaskUp=(e,at)=>{tl.set($$('.ch',e),{opacity:1},at);for(const [i,ln] of $$('.ln',e).entries()){
  tl.fromTo(ln,{clipPath:'inset(100% 0% -10% 0%)',y:60},{clipPath:'inset(0% 0% -10% 0%)',y:0,duration:.85,ease:'power3.out',...I},at+i*.18);}};
const inDepth=(ch,e,at)=>{tl.fromTo(ch,{opacity:0,scale:2.2},{opacity:1,scale:1,duration:1,ease:'expo.out',stagger:{each:.02,from:'center'},...I},at);blurTween(tl,e,at,20,0,1,{ease:'expo.out',ax:1,ay:1});};
const outUp=(ch,e,at)=>{tl.to(ch,{opacity:0,yPercent:-70,duration:.42,ease:'power2.in',stagger:.008},at);blurTween(tl,e,at,0,40,.5,{ease:'power2.in',...VERT});};
const outDown=(ch,e,at)=>{tl.to(ch,{opacity:0,yPercent:70,duration:.42,ease:'power2.in',stagger:.008},at);blurTween(tl,e,at,0,40,.5,{ease:'power2.in',...VERT});};
const outLeft=(ch,e,at)=>{tl.to(ch,{opacity:0,xPercent:-60,duration:.42,ease:'power2.in',stagger:.008},at);blurTween(tl,e,at,0,50,.5,{ease:'power2.in'});};
const outRight=(ch,e,at)=>{tl.to(ch,{opacity:0,xPercent:60,duration:.42,ease:'power2.in',stagger:{each:.008,from:'end'}},at);blurTween(tl,e,at,0,50,.5,{ease:'power2.in'});};
const camTo=(at,dur,v,ease='power3.inOut')=>tl.to(cam,{...v,duration:dur,ease},at);

const t1=$('#t1'),t2=$('#t2'),t3=$('#t3'),t4=$('#t4'),t5=$('#t5');
const c1=splitChars(t1),c2=splitChars(t2),c3=splitChars(t3),c4=splitChars(t4),c5=splitChars(t5);

// initial state (written at 0 so the loop resets cleanly)
tl.set(cam,{x:960,y:-1500,z:1},0);
tl.set(heart,{x:960,y:-1640,s:.2,r:-20,o:0},0);

tl.set('#berries g',{y:-520,opacity:0},0); tl.set('#mint',{scale:0,transformOrigin:'50% 100%'},0);
const dl=$('#drizzle').getTotalLength(); tl.set('#drizzle',{strokeDasharray:dl,strokeDashoffset:dl},0);

tl.set('#straw',{y:0},0); tl.set('#coat',{opacity:0},0); tl.set('.drip',{opacity:0,y:0},0); tl.set('#ripple',{opacity:0,attr:{rx:60,ry:12}},0);
tl.set(POPS,{opacity:0,scale:.2,x:0,y:0},0); tl.set(MINI,{opacity:0},0);
tl.set('#brownie',{y:0,opacity:1},0);
const rl=2*Math.PI*318; tl.set('#ring',{strokeDasharray:rl,strokeDashoffset:rl},0); tl.set('#ring2',{opacity:0,rotation:0,transformOrigin:'50% 50%'},0);
tl.set('#badge',{opacity:0,scale:.3,rotation:-25},0); tl.set('#label',{opacity:0,y:30},0);

/* --- 0–6 · night sky, the heart appears and falls --- */
tl.to(heart,{o:1,s:1,r:0,duration:1.1,ease:'back.out(2)'},.5);
camTo(2.8,1.3,{y:-860},'power2.inOut');
tl.to(heart,{y:-1130,duration:1.3,ease:'power2.inOut'},2.8);
tl.set(t1,{autoAlpha:1},0); inDown(c1,t1,4.0);

/* --- 6.2–8 · fall through the clouds to the counter --- */
camTo(6.2,1.9,{y:560},'power3.inOut');

tl.to(heart,{s:0,o:0,duration:.18,ease:'power2.in'},8.0);
/* --- 8–13 · jar cheesecake builds; close-up on the berries --- */
tl.to('#compote',{scaleY:1,duration:1.3,ease:'power2.out'},8.05);

camTo(9.4,1.1,{y:420,z:1.7});
T('#berries g').forEach((b,i)=>{const at=9.85+i*.24;
  tl.to(b,{y:0,opacity:1,duration:.38,ease:'power2.in'},at);
  tl.fromTo(b,{scaleY:1,scaleX:1,transformOrigin:'50% 100%'},{scaleY:.78,scaleX:1.16,duration:.08,yoyo:true,repeat:1,ease:'sine.out',...I},at+.38);});

tl.set(t3,{autoAlpha:1},0); inLeft(c3,t3,14.55);

tl.fromTo('#scoop',{scaleY:1,scaleX:1,transformOrigin:'50% 100%'},{scaleY:.8,scaleX:1.14,duration:.1,yoyo:true,repeat:1,ease:'sine.out',...I},15.87);
outRight(c3,t3,16.15);
camTo(16.15,1.1,{x:2575,y:560,z:1.5},'power2.inOut');
/* --- 17.3–21.8 · the dip (special moment) --- */
camTo(17.3,1.25,{x:4490,y:560,z:1.1});
tl.to('#straw',{y:300,duration:.55,ease:'power2.in'},18.65);
tl.to('#ripple',{opacity:.9,attr:{rx:170,ry:34},duration:.55,ease:'power2.out'},19.15);

tl.set('#coat',{opacity:1},19.25);
tl.to('#straw',{y:0,duration:.8,ease:'power3.out'},19.45);
T('.drip').forEach((d,i)=>{const at=20.2+i*.42;tl.set(d,{opacity:1,y:0},at);tl.to(d,{y:150,duration:.38,ease:'power2.in'},at);tl.set(d,{opacity:0},at+.38);
  tl.fromTo('#ripple',{opacity:.7,attr:{rx:30,ry:6}},{opacity:0,attr:{rx:90,ry:18},duration:.4,...I},at+.38);});
tl.set(t4,{autoAlpha:1},0); inMaskUp(t4,19.9);
outUp(c4,t4,21.75);
/* --- 21.9–25.5 · pull back wide, cream wave rises, tagline --- */
camTo(21.9,1.5,{x:2560,y:560,z:.42});
tl.to(sky,{cream:-330,duration:1.4,ease:'power2.inOut'},22.25);
tl.to(sky,{clouds:0,vig:.35,duration:.8},22.4);
POPS.forEach((p,i)=>tl.to(p,{opacity:1,scale:1,duration:.5,ease:'back.out(2.4)'},23.3+i*.12));
POPS.forEach((p,i)=>tl.to(p,{y:-30,duration:2,ease:'sine.inOut'},23.8));
tl.set(t5,{autoAlpha:1},0); inDepth(c5,t5,23.7);
outUp(c5,t5,25.35);
/* --- 25.4–30 · the badge --- */
tl.to('#brownie',{y:90,opacity:0,duration:.5,ease:'power2.in'},25.3);

POPS.forEach((p,i)=>{const dx=[1600,0,-1600][i],dy=[340,330,420][i];tl.to(p,{x:dx,y:dy,scale:.1,opacity:0,duration:.6,ease:'power2.in'},25.6+i*.05);});

tl.to('#ring',{strokeDashoffset:0,duration:1,ease:'power2.inOut'},26.15);

MINI.forEach((m,i)=>{tl.to(m,{opacity:1,duration:.4},27.2+i*.15);tl.fromTo(m,{y:20},{y:-30,duration:2.5,ease:'sine.inOut',...I},27.2+i*.15);});
camTo(27,3,{z:1.05},'sine.inOut');
tl.to({},{duration:.01},DURATION);

/* ============ glue ============ */
const stage=$('#stage');
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();
const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play');let scrubbing=false;
(function frame(){const t=tl.time();render(t);clock.textContent=t.toFixed(2)+'s';if(!scrubbing)scrub.value=String(t/DURATION*1000);requestAnimationFrame(frame);})();
const toggle=()=>{if(tl.paused()){tl.play();btn.textContent='Pause';}else{tl.pause();btn.textContent='Play';}};
btn.onclick=toggle; $('#btn-restart').onclick=()=>{tl.pause(0);tl.play();btn.textContent='Pause';};
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();}if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on');});
if(Q.has('debug'))$('#ui').classList.add('on');
